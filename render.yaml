services:
  - type: web
    name: equipment-api
    env: python
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "gunicorn equipment_api.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: DATABASE_URL
        fromDatabase:
          name: equipment-db
          property: connectionString
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

databases:
  - name: equipment-db
    region: oregon
    plan: free
